          inset 0 0 40px rgba(216, 180, 90, .06);
        animation-duration:
          .9s;
        animation-timing-function:
          cubic-bezier(.77, 0, .18, 1);
        animation-delay:
          1.65s;
        animation-fill-mode:
          forwards;

      .opening::before {
        left: 0;
        border-right:
          1px solid rgba(216, 180, 90, .28);
        animation-name:
          rvPanelLeft;
      }

      .opening::after {
        right: 0;
        border-left:
          1px solid rgba(85, 230, 255, .18);
        animation-name:
          rvPanelRight;
      }

        justify-content: center;

      .opening-seal {
        position: relative;
        width: 72px;
        height: 72px;
        margin-bottom: 24px;
        opacity: 0;
        transform:
          rotate(45deg) scale(.15);
        background:
          linear-gradient(145deg,
            #fff4bd,
            #d8b45a 48%,
            #715019);
        border:
          1px solid #fff0aa;
        box-shadow:
          0 0 0 7px rgba(216, 180, 90, .05),
          0 0 38px rgba(216, 180, 90, .50),
          0 0 75px rgba(85, 230, 255, .08),
          inset 0 1px 0 rgba(255, 255, 255, .48),
          inset 0 -10px 20px rgba(60, 40, 0, .30);
        animation:
          rvSealReveal 1.05s var(--ease-pro) .1s forwards,
          rvSealGlow 3s ease-in-out 1.2s infinite;
      }

      .opening-seal::before,
      .opening-seal::after {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        background:
          #080807;
        transform:
          translate(-50%, -50%);
      }

      .opening-seal::before {
        width: 28px;
        height: 2px;
      }

      .opening-seal::after {
        width: 2px;
        height: 28px;
